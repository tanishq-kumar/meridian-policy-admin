server:
  port: 8081

spring:
  datasource:
    # Local stack per .commandcode/skills/meridian-local-stack/SKILL.md
    # Host PG 5432 (postgres/postgres) is live on this machine. Compose PG is 5433.
    # Override with SPRING_DATASOURCE_URL when running against compose.
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pas
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: pas
    default-schema: pas
    baseline-on-migrate: true
